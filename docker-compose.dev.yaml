services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      KEYCLOAK_DB: keycloak
      KEYCLOAK_USER: keycloak
      KEYCLOAK_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./user-service/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - keycloak-net
      - application-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: root
      KC_BOOTSTRAP_ADMIN_PASSWORD: rootroot

      KC_DB: postgres
      KC_DB_URL_HOST: postgres

      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_HEALTH_ENABLED: true
    ports:
      - "8000:8080"
    networks:
      - keycloak-net
    healthcheck:
      test: [ "CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?" ]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    container_name: pokubuy-user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: pokubuy-user-service:int
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: root
      KEYCLOAK_ADMIN_PASSWORD: rootroot
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT: admin-cli

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

      SPRING_PROFILES_ACTIVE: int
    networks:
      - keycloak-net
    ports:
      - "8081:9090"
    depends_on:
      keycloak:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.1
    container_name: pokubuy-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/
    networks:
      - application-net

  redis:
    image: redis:7-alpine
    container_name: pokubuy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - application-net
    command: [ "redis-server", "--appendonly", "yes" ]

  backend:
    container_name: pokubuy-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pokubuy-backend:int
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - application-net
    ports:
      - "8082:8080"
    depends_on:
      - kafka
      - redis

volumes:
  postgres-data:
  kafka-data:
  redis-data:

networks:
  keycloak-net:
  application-net: